server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false

  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dmz2knvds}
  api-key: ${CLOUDINARY_API_KEY:744686633472466}
  api-secret: ${CLOUDINARY_API_SECRET:wK190p44-qOla-U-QpN2o1XzI7Q}